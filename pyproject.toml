[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sahkku"
version = "0.1.0"
description = "Unofficial, rules-configurable desktop/web version of the Sámi board game sáhkku"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["nicegui>=2.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
sahkku = "sahkku.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sahkku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
main_file = ""
addopts = "-ra"
markers = ["slow: long-running tests (self-play)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Typographic quotes, dashes and the multiplication sign are intentional in UI text.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/sahkku/ui/*.py" = ["E501"]
"src/sahkku/rules/variants.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sahkku/engine", "src/sahkku/rules", "src/sahkku/ai"]
mypy_path = "src"
